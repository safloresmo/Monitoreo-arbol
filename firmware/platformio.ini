; Un mismo programa para todos los nodos: cada entorno elige el sensor.
;
;   pio run -e ambiente -t upload
;   pio run -e flujo -t upload
;   pio run -e suelo1 -t upload

[platformio]
default_envs = ambiente

[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8

[env:ambiente]
build_flags = -D NODO_AMBIENTE
lib_deps =
    ${env.lib_deps}
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

[env:flujo]
build_flags = -D NODO_FLUJO

[env:suelo1]
build_flags = -D NODO_SUELO -D TEMA_SUELO=\"limon/suelo\"

[env:suelo2]
build_flags = -D NODO_SUELO -D TEMA_SUELO=\"limon/suelo2\"

[env:suelo3]
build_flags = -D NODO_SUELO -D TEMA_SUELO=\"limon/suelo3\"
